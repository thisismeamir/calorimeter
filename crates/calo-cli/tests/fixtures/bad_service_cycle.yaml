schema: calo.suite/1
suite:
  name: bad_service_cycle
builds:
  release:
    run: "make"
steps:
  run_sim:
    run: "./app"
    measured: true
benchmarks:
  - name: b1
    machine: hpc-a/gpu-a100
    build: release
    steps: [run_sim]
services:
  svc_a:
    expr: "svc_b * 2"
  svc_b:
    expr: "svc_a + 1"
