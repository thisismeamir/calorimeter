name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt-and-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  test-parquet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --features calo-core/parquet

  example-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo run -p calo-cli -- \
            --suite examples/cosmolattice/suite.yaml \
            --inventory examples/cosmolattice/inventory.yaml \
            lint
      - run: |
          cargo run -p calo-cli -- \
            --suite examples/cosmolattice/suite.yaml \
            --inventory examples/cosmolattice/inventory.yaml \
            plan --format yaml
